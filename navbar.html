<!DOCTYPE html>
<html>
<head>
    <title>nav bar</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
    .navbar {
        background-color: rgb(139, 177, 231);
        color: white;
        padding:10px;
        display: flex;
    }
    .navbar,ul {
        display: flex;
        gap: 30px;
        justify-content: flex-end;

    }
    li{
        list-style: none;
    }
    img{
        margin-right:200px;
    }
    input{
        height:30px;
        margin-top: 10px;
        width: 300px;
    }
    button{
        height: 30px;
        margin-top: 10px;
        margin-right:200px;
    ;
    }
    a{
        text-decoration: none;
        
    }
    </style>

    
</head>
<body>
    <h1>Navigation Bar</h1>
    <div class="navbar">
        <img src="./logo.png" alt="logo" width="300px" height="50px">
        <input type="text">                                                                                        
        <button>Search </button>
        <ul>
            <li><a href="https://www.alliance.edu.in/">Home</a></li>
            <li><a href="https://www.alliance.edu.in/about-us/about-usMenu">About Us</a></li>
            <li><a href="https://www.alliance.edu.in/services">Services</a></li>
            <li><a href="https://www.alliance.edu.in/contact-us">Contact Us</a></li>            
                        

        </ul>
</body>
</html>
